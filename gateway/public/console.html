<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>种核 KIN · 管理台</title>
  <style>
:root {
  --background: oklch(0.129 0.042 264.695);
  --foreground: oklch(0.984 0.003 247.858);
  --card: oklch(0.168 0.038 260);
  --card-foreground: oklch(0.984 0.003 247.858);
  --primary: oklch(0.929 0.013 255.508);
  --primary-foreground: oklch(0.208 0.042 265.755);
  --muted: oklch(0.22 0.03 260);
  --muted-foreground: oklch(0.704 0.04 256.788);
  --border: oklch(1 0 0 / 12%);
  --input: oklch(1 0 0 / 15%);
  --ring: oklch(0.55 0.03 264);
  --destructive: oklch(0.65 0.2 22);
  --sidebar: oklch(0.145 0.04 264);
  --sidebar-foreground: oklch(0.95 0.01 250);
  --sidebar-border: oklch(1 0 0 / 10%);
  --accent: oklch(0.22 0.03 260);
  --radius: 0.5rem;
}
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--background);
  color: var(--foreground);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
button, input, textarea { font: inherit; }
a { color: inherit; }

/* layout shell */
.app {
  display: flex;
  min-height: 100vh;
  width: 100%;
}
.sidebar {
  width: 220px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--sidebar);
  color: var(--sidebar-foreground);
  border-right: 1px solid var(--sidebar-border);
}
.sidebar-head {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-head .title { font-size: 16px; font-weight: 600; }
.sidebar-head .sub { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }
.sidebar-nav { flex: 1; padding: 8px; overflow: auto; }
.sidebar-foot {
  padding: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.topbar h1 { margin: 0; font-size: 14px; font-weight: 600; }
.topbar p { margin: 0; font-size: 12px; color: var(--muted-foreground); }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.content {
  flex: 1;
  overflow: auto;
  padding: 24px;
}

/* login */
#loginGate {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: var(--background);
}
#loginGate.hidden { display: none !important; }
body.login-only .app { visibility: hidden; pointer-events: none; }
.login-card {
  width: 100%; max-width: 360px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
}
.login-card h2 { margin: 0 0 4px; font-size: 18px; }
.login-card .hint { margin: 0 0 16px; font-size: 12px; color: var(--muted-foreground); }
.login-card .stack { display: flex; flex-direction: column; gap: 10px; }

/* components */
.layer-tag {
  font-size: 11px;
  color: var(--muted-foreground);
  text-transform: none;
  letter-spacing: 0.02em;
  padding: 10px 12px 4px;
  font-weight: 500;
}
.nav-item {
  display: block;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--muted-foreground);
  user-select: none;
}
.nav-item:hover { background: var(--accent); color: var(--foreground); }
.nav-item.active {
  background: var(--accent);
  color: var(--foreground);
  font-weight: 500;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 36px; padding: 0 12px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 13px; font-weight: 500;
  background: transparent; color: var(--foreground);
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: var(--primary) !important;
  color: var(--primary-foreground) !important;
  border: none;
  font-weight: 600;
}
.btn-outline {
  border: 1px solid var(--border);
  background: transparent;
}
.btn-outline:hover { background: var(--accent); }
.btn-ghost { border: none; background: transparent; }
.btn-ghost:hover { background: var(--accent); }
.input, textarea.input {
  width: 100%;
  height: 36px;
  border-radius: 6px;
  border: 1px solid var(--input);
  background: oklch(0.18 0.03 260);
  color: var(--foreground);
  padding: 0 12px;
  outline: none;
  -webkit-appearance: none;
}
textarea.input { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; }
.input:focus { border-color: var(--ring); box-shadow: 0 0 0 2px oklch(0.55 0.03 264 / 25%); }
.input::placeholder { color: var(--muted-foreground); }
.card {
  background: var(--card);
  color: var(--card-foreground);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}
.badge {
  display: inline-flex; align-items: center;
  height: 22px; padding: 0 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted-foreground);
  background: transparent;
}
.badge.ok { color: oklch(0.75 0.15 150); border-color: oklch(0.75 0.15 150 / 40%); }
.badge.warn { color: oklch(0.8 0.14 80); border-color: oklch(0.8 0.14 80 / 40%); }
.badge.err { color: var(--destructive); border-color: oklch(0.65 0.2 22 / 40%); }

/* page sections */
.section { display: flex; flex-direction: column; gap: 16px; }
.section-title {
  font-size: 11px;
  color: var(--muted-foreground);
  font-weight: 500;
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--sidebar-border); }
  .sidebar-nav { display: flex; flex-wrap: wrap; gap: 4px; }
  .layer-tag { width: 100%; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .content { padding: 16px; }
  .topbar { padding: 0 16px; height: auto; min-height: 56px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
}
.card .label { font-size: 12px; color: var(--muted-foreground); }
.card .value { font-size: 20px; font-weight: 600; margin-top: 4px; }
.card .meta { font-size: 12px; color: var(--muted-foreground); margin-top: 6px; }
.bar {
  height: 6px; border-radius: 99px;
  background: oklch(1 0 0 / 8%);
  overflow: hidden; margin-top: 10px;
}
.bar > i {
  display: block; height: 100%;
  background: oklch(0.7 0.12 200);
  border-radius: 99px;
}
.bar.warn > i { background: oklch(0.8 0.14 80); }
.bar.danger > i { background: var(--destructive); }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.muted { color: var(--muted-foreground); }
.danger { color: var(--destructive); }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.stack-md { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.table th, .table td {
  text-align: left; padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.table th { color: var(--muted-foreground); font-weight: 500; font-size: 12px; }
#toast {
  position: fixed; right: 16px; bottom: 16px; z-index: 200;
  background: var(--card); border: 1px solid var(--border);
  padding: 10px 14px; border-radius: 8px;
  display: none; max-width: 320px;
}
#toast.show { display: block; }
.hidden { display: none !important; }
.text-xs { font-size: 12px; }
.text-sm { font-size: 13px; }
.font-medium { font-weight: 500; }
.font-semibold { font-weight: 600; }

.cursor-pointer, [style*="cursor:pointer"] { cursor: pointer; }
.card[onclick]:hover { border-color: oklch(1 0 0 / 25%); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
.table th { color: var(--muted-foreground); font-weight: 500; font-size: 12px; }
code { font-family: ui-monospace, monospace; font-size: 12px; background: oklch(1 0 0 / 6%); padding: 1px 5px; border-radius: 4px; }
ul { margin: 0; padding-left: 18px; }

</style>
</head>
<body class="login-only">
  <div id="loginGate">
    <div class="login-card">
      <h2>种核 KIN</h2>
      <p class="hint">管理台登录</p>
      <div class="stack">
        <input id="loginUserInput" class="input" placeholder="用户名" autocomplete="username" value="admin" />
        <input id="loginPassInput" type="password" class="input" placeholder="密码" autocomplete="current-password" />
        <input id="loginBaseInput" class="input" placeholder="API Base（本站可留空）" />
        <button type="button" class="btn btn-primary" onclick="doLogin()">登录</button>
        <p id="loginErr" class="text-xs danger hidden"></p>
      </div>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="title">种核 KIN</div>
        <div class="sub">多虚拟机 · Claude Code 网关</div>
      </div>
      <nav class="sidebar-nav" id="nav">
        <div class="layer-tag">L0 · 平台</div>
        <div class="nav-item active" data-view="overview">总览</div>
        <div class="layer-tag">L1 · 集群</div>
        <div class="nav-item" data-view="cluster">虚拟机集群</div>
        <div class="layer-tag">L2–L3 · 节点</div>
        <div class="nav-item" data-view="vm">虚拟机详情</div>
        <div class="layer-tag">L4 · 用量</div>
        <div class="nav-item" data-view="usage">用量与额度</div>
        <div class="layer-tag">L5 · 协议</div>
        <div class="nav-item" data-view="protocol">协议与模型</div>
        <div class="layer-tag">L6 · 配置</div>
        <div class="nav-item" data-view="proxies">代理池 SOCKS5</div>
        <div class="nav-item" data-view="settings">路由与策略</div>
      </nav>
      <div class="sidebar-foot">
        <div class="text-xs muted">已登录 · <span id="loginUser">—</span></div>
        <button class="btn btn-outline" style="width:100%" onclick="logout()">退出登录</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">总览</h1>
          <p id="pageDesc">平台健康 · 集群摘要</p>
        </div>
        <div class="topbar-actions">
          <span id="healthPill" class="badge">—</span>
          <button class="btn btn-outline" onclick="refresh()">刷新</button>
          <button class="btn btn-outline" onclick="probeAll()">全量探测</button>
        </div>
      </header>
      <main class="content" id="main"></main>
    </div>
  </div>

  <div id="toast"></div>

  <script>
const LS = 'kin_console_token'
const LS_USER = 'kin_console_user'
const LS_BASE = 'kin_api_base'
const titles = {
  overview: ['总览', 'L0 平台 + L1 集群摘要'],
  cluster: ['虚拟机集群', 'L1 多种子节点一览'],
  vm: ['虚拟机详情', 'L2 节点 · L3 账号凭证'],
  usage: ['用量与额度', 'L4 官方 stats · 95% 安全线'],
  protocol: ['协议与模型', 'L5 对齐 Claude Code 官方标准'],
  proxies: ['代理池 SOCKS5', 'L1/L6 一代理绑定一 VM · 自动探测'],
  settings: ['路由与策略', 'L6 粘性 · 并发 · 额度'],
}
let state = { view: 'overview', selectedVm: null, dashboard: null, usage: null, models: null, routing: null, detail: null, proxies: null }

function apiBase() {
  const host = (location.hostname || '')
  if (/kin\.fkcodex\.com$/i.test(host)) return ''
  const saved = (localStorage.getItem(LS_BASE) || '').replace(/\/$/, '')
  if (saved) return saved
  if (/vercel\.app$|netlify\.app$|github\.io$/.test(host)) return 'https://kin.fkcodex.com'
  return ''
}
function key() { return (localStorage.getItem(LS) || '').trim() }
function logout() {
  localStorage.removeItem(LS)
  localStorage.removeItem(LS_USER)
  document.getElementById('loginGate').classList.remove('hidden')
  document.body.classList.add('login-only')
  document.getElementById('loginUser').textContent = '—'
}
async function doLogin() {
  const user = document.getElementById('loginUserInput').value.trim()
  const pass = document.getElementById('loginPassInput').value
  const err = document.getElementById('loginErr')
  err.classList.add('hidden')
  // On official domain always use same-origin (ignore stale localStorage base)
  const host = location.hostname || ''
  let base = ''
  if (/kin\.fkcodex\.com$/i.test(host)) {
    base = ''
    localStorage.removeItem(LS_BASE)
    const baseEl = document.getElementById('loginBaseInput')
    if (baseEl) baseEl.value = ''
  } else {
    base = (document.getElementById('loginBaseInput').value || '').trim().replace(/\/$/, '') || apiBase()
    if (base) localStorage.setItem(LS_BASE, base)
    else localStorage.removeItem(LS_BASE)
  }
  const url = (base || '') + '/api/panel/login'
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass }),
    })
    if (res.status === 405) throw new Error('405 Method Not Allowed: ' + url)
    const j = await res.json().catch(() => ({}))
    if (!res.ok || !j.token) throw new Error(j?.error?.message || j?.message || ('登录失败 HTTP ' + res.status + ' @ ' + url))
    localStorage.setItem(LS, j.token)
    localStorage.setItem(LS_USER, j.user || user)
    document.getElementById('loginGate').classList.add('hidden')
    document.body.classList.remove('login-only')
    document.getElementById('loginUser').textContent = j.user || user
    toast('登录成功')
    refresh()
  } catch (e) {
    const msg = e.message || String(e)
    if (/Failed to fetch|NetworkError|CORS|Load failed|network/i.test(msg)) {
      err.textContent = '无法连接: ' + url + ' （请确认可打开该域名，或清空浏览器站点数据后重试）'
    } else {
      err.textContent = msg
    }
    err.classList.remove('hidden')
  }
}
function headers() { return { Authorization: 'Bearer ' + key(), 'Content-Type': 'application/json' } }
async function api(path, opts={}) {
  if (!key()) throw new Error('未登录')
  const url = (apiBase() || '') + path
  const res = await fetch(url, { ...opts, headers: { ...headers(), ...(opts.headers||{}) } })
  const j = await res.json().catch(() => ({}))
  if (res.status === 401) {
    logout()
    throw new Error('鉴权失效，请重新登录')
  }
  if (!res.ok || j.ok === false) throw new Error(j?.error?.message || j?.message || res.statusText)
  return j.data !== undefined ? j.data : j
}
function pct(u) { if (u==null) return 0; const n=Number(u); return n>1?n:n*100 }
function barColor(p) { if (p>=95) return 'var(--destructive)'; if (p>=85) return 'oklch(0.78 0.16 75)'; return 'oklch(0.72 0.17 145)' }
function toast(m) {
  const el = document.createElement('div')
  el.className = 'fixed bottom-4 right-4 z-50 rounded-md border border bg-popover text-popover-foreground px-3 py-2 text-sm shadow-md'
  el.textContent = m
  document.body.appendChild(el)
  setTimeout(() => el.remove(), 2200)
}
function esc(s) { return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

// Nav
document.getElementById('loginPassInput') && document.getElementById('loginPassInput').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin() })
document.getElementById('nav').addEventListener('click', (e) => {
  const item = e.target.closest('.nav-item')
  if (!item) return
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
  item.classList.add('active')
  state.view = item.dataset.view
  const [t,d] = titles[state.view]
  document.getElementById('pageTitle').textContent = t
  document.getElementById('pageDesc').textContent = d
  render()
})

async function refresh() {
  if (!key()) { toast('请先填写 API Key'); return }
  try {
    const safe = (p) => api(p).catch((e) => ({ __error: e.message || String(e) }))
    const [dash, usage, models, routing, proxies] = await Promise.all([
      safe('/api/panel/dashboard'),
      safe('/api/panel/usage'),
      safe('/api/panel/models?refresh=1'),
      safe('/api/panel/routing'),
      safe('/api/panel/proxies'),
    ])
    state.dashboard = dash?.__error ? { error: dash.__error } : (dash.data || dash)
    state.usage = usage?.__error ? { error: usage.__error } : (usage.data || usage)
    // models: support {items}, {data:{items}}, or OpenAI {data:[{id}]}
    let m = models?.__error ? null : (models.data || models)
    if (m && Array.isArray(m.data) && !m.items) {
      m = { items: m.data.map(x => ({ id: x.id, label: x.display_name || x.id })), source: m.source, total: m.data.length }
    }
    if (m && !m.items && Array.isArray(m)) {
      m = { items: m.map(x => ({ id: x.id || x, label: x.label || x.display_name || x.id || x })), source: 'list' }
    }
    state.models = m || { items: [], source: 'error', note: models?.__error || 'empty' }
    state.routing = routing?.__error ? { error: routing.__error } : (routing.data || routing)
    state.proxies = proxies?.__error ? { error: proxies.__error } : (proxies.data || proxies)
    if (!state.selectedVm && state.dashboard.vms?.[0]) state.selectedVm = state.dashboard.vms[0].id
    const h = state.dashboard.health
    document.getElementById('healthPill').textContent = (h?.status || 'ok') + ' · ' + (h?.base_url || '')
    render()
  } catch (e) { toast('刷新失败: ' + e.message) }
}

async function probeAll() {
  try {
    toast('全量探测中…')
    await api('/api/panel/probe', { method: 'POST' })
    toast('探测完成')
    await refresh()
  } catch (e) { toast(e.message) }
}

async function probeOne(id) {
  try {
    toast('探测 ' + id)
    await api('/api/panel/vms/' + id + '/probe', { method: 'POST' })
    toast('完成')
    await refresh()
  } catch (e) { toast(e.message) }
}

async function openVm(id) {
  state.selectedVm = id
  try {
    const r = await api('/api/panel/vms/' + id)
    state.detail = r.data || r
  } catch (e) { state.detail = null; toast(e.message) }
  state.view = 'vm'
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view==='vm'))
  const [t,d] = titles.vm
  document.getElementById('pageTitle').textContent = t
  document.getElementById('pageDesc').textContent = d
  render()
}

function render() {
  const main = document.getElementById('main')
  const d = state.dashboard
  if (!d) { main.innerHTML = '<p class="text-sm muted">请保存 API Key 后刷新</p>'; return }
  const views = { overview: renderOverview, cluster: renderCluster, vm: renderVm, usage: renderUsage, protocol: renderProtocol, proxies: renderProxies, settings: renderSettings }
  main.innerHTML = (views[state.view] || renderOverview)()
}

function summaryCards(s) {
  const p5 = pct(s.peak_5h), p7 = pct(s.peak_7d)
  return `
  <div class="grid-4">
    ${card('虚拟机', s.vm_count, 'L1 集群规模')}
    ${card('账号', s.account_count, 'L3 凭证数')}
    ${cardBar('峰值 5h', p5.toFixed(1)+'%', p5, '安全线 95%')}
    ${cardBar('峰值 7d', p7.toFixed(1)+'%', p7, '周额度')}
  </div>
  <div class="grid-3">
    ${card('总请求', s.requests, '累计')}
    ${card('Tokens', (s.tokens_in||0)+' / '+(s.tokens_out||0), 'In / Out')}
    ${card('近限额', s.near_limit, '≥95% 账号数')}
  </div>`
}
function card(label, value, sub) {
  return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="meta">${esc(sub||'')}</div></div>`
}
function cardBar(label, value, p, sub) {
  const cls = p >= 95 ? 'danger' : p >= 80 ? 'warn' : ''
  return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="bar ${cls}"><i style="width:${Math.min(100,p)}%;background:${barColor(p)}"></i></div><div class="meta">${esc(sub||'')}</div></div>`
}

function vmCard(v) {
  const u5 = pct(v.utilization_5h), u7 = pct(v.utilization_7d)
  return `
  <div class="card style="cursor:pointer"" onclick="openVm('${esc(v.id)}')">
    <div class="row">
      <div>
        <div class="font-medium">${esc(v.name||v.id)}</div>
        <div class="text-xs muted">${esc(v.id)}</div>
      </div>
      <div class="stack-sm">
        ${v.active ? '<span class="badge ok">active</span>' : '<span class="badge">standby</span>'}
        <span class="badge">${esc(v.status||'—')}</span>
      </div>
    </div>
    <div class="mt-3 text-xs muted ">${esc(v.email||'无邮箱')}</div>
    <div class="mt-3 stack-sm">
      <div><div class="flex justify-between text-xs mb-1"><span>5h</span><span>${u5.toFixed(1)}%</span></div><div class="bar"><i style="width:${Math.min(100,u5)}%;background:${barColor(u5)}"></i></div></div>
      <div><div class="flex justify-between text-xs mb-1"><span>7d</span><span>${u7.toFixed(1)}%</span></div><div class="bar"><i style="width:${Math.min(100,u7)}%;background:${barColor(u7)}"></i></div></div>
    </div>
    <div class="mt-3 flex justify-between text-xs muted">
      <span>并发 ${v.inflight||0}/${v.max_concurrency||2}</span>
      <span>CC ${esc(v.claude_code_version||'—')}</span>
    </div>
    <div class="mt-3 flex gap-2" onclick="event.stopPropagation()">
      <button class="btn btn-outline h-8 text-xs" onclick="probeOne('${esc(v.id)}')">探测</button>
      <button class="btn btn-ghost h-8 text-xs" onclick="openVm('${esc(v.id)}')">详情</button>
    </div>
  </div>`
}

function renderOverview() {
  const d = state.dashboard
  return `
  <section class="section">
    <div>
      <div class="section-title">L0 · 平台层</div>
      <div class="card" style="display:flex;flex-wrap:wrap;gap:24px">
        <div><span class="muted">服务</span><div class="font-medium">${esc(d.health?.service||'kin-gateway')}</div></div>
        <div><span class="muted">Base URL</span><div class="font-medium mono">${esc(d.health?.base_url||'')}</div></div>
        <div><span class="muted">改写</span><div class="font-medium">${esc(d.health?.rewrite||'off')}</div></div>
        <div><span class="muted">粘性会话</span><div class="font-medium">${d.routing?.sticky_sessions??0}</div></div>
      </div>
    </div>
    <div>
      <div class="section-title">L1 · 集群摘要</div>
      ${summaryCards(d.summary||{})}
    </div>
    <div>
      <div class="section-title">集群节点预览</div>
      <div class="grid-3">
        ${(d.vms||[]).map(vmCard).join('') || '<p class="text-sm muted">暂无虚拟机</p>'}
      </div>
    </div>
  </section>`
}

function renderCluster() {
  const d = state.dashboard
  return `
  <section class="section">
    <div class="row">
      <div class="section-title">L1 · 虚拟机集群 · ${d.vms?.length||0} 节点</div>
      <button class="btn btn-outline" onclick="probeAll()">全量探测用量</button>
    </div>
    <div class="grid-3">
      ${(d.vms||[]).map(vmCard).join('') || '<p class="text-sm muted">暂无虚拟机，请导入种子 VM</p>'}
    </div>
    <p class="text-xs muted">卡片 = 最小管理单元：状态 · OAuth 账号 · 5h/7d 用量 · 并发 · Claude Code 版本</p>
  </section>`
}

function renderVm() {
  const det = state.detail
  const vms = state.dashboard?.vms || []
  if (!det && !state.selectedVm) {
    return `<p class="text-sm muted">从集群选择一台虚拟机</p>
    <div class="grid-3">${vms.map(vmCard).join('')}</div>`
  }
  const vm = det?.vm || vms.find(x => x.id === state.selectedVm) || {}
  const acc = det?.account
  const u5 = pct(acc?.utilization_5h ?? vm.utilization_5h)
  const u7 = pct(acc?.utilization_7d ?? vm.utilization_7d)
  return `
  <section class="section">
    <div class="actions">
      <select class="input w-64" onchange="openVm(this.value)">
        ${vms.map(v => `<option value="${esc(v.id)}" ${v.id===vm.id?'selected':''}>${esc(v.name||v.id)}</option>`).join('')}
      </select>
      <button class="btn btn-outline" onclick="probeOne('${esc(vm.id)}')">官方用量探测</button>
      <button class="btn btn-outline" onclick="allocateProxy('${esc(vm.id)}')">分配 SOCKS5</button>
    </div>
    <div class="grid-3">
      <div class="card stack-md">
        <div class="section-title">L2 · 虚拟机</div>
        <div class="text-lg font-semibold">${esc(vm.name||vm.id)}</div>
        <dl class="grid grid-cols-2 gap-2 text-sm">
          <dt class="muted">ID</dt><dd class="mono">${esc(vm.id)}</dd>
          <dt class="muted">状态</dt><dd>${esc(vm.status)} ${vm.active?'· active':''}</dd>
          <dt class="muted">Claude Code</dt><dd>${esc(vm.claude_code_version||'—')}</dd>
          <dt class="muted">并发</dt><dd>${vm.inflight||0} / ${vm.max_concurrency||2}</dd>
          <dt class="muted">Token</dt><dd>${vm.has_token?'已绑定':'未绑定'}</dd>
        </dl>
      </div>
      <div class="card stack-md">
        <div class="section-title">L3 · 账号凭证</div>
        <div class="text-sm">${esc(vm.email||'—')}</div>
        <div class="text-xs font-mono muted break-all">${esc(vm.account_uuid||'—')}</div>
        <div class="stack-sm pt-2">
          <div><div class="flex justify-between text-xs mb-1"><span>5h 用量</span><span>${u5.toFixed(1)}%</span></div><div class="bar"><i style="width:${Math.min(100,u5)}%;background:${barColor(u5)}"></i></div></div>
          <div><div class="flex justify-between text-xs mb-1"><span>7d 用量</span><span>${u7.toFixed(1)}%</span></div><div class="bar"><i style="width:${Math.min(100,u7)}%;background:${barColor(u7)}"></i></div></div>
        </div>
        ${acc?.reset_5h ? `<div class="text-xs muted">5h 重置: ${esc(acc.reset_5h)}</div>` : ''}
        ${acc?.reset_7d ? `<div class="text-xs muted">7d 重置: ${esc(acc.reset_7d)}</div>` : ''}
      </div>
    </div>
    ${acc?.recent?.length ? `
    <div class="card">
      <div class="section-title">最近分配记录</div>
      <pre class="text-xs overflow-auto max-h-48">${esc(JSON.stringify(acc.recent, null, 2))}</pre>
    </div>` : ''}
  </section>`
}

function renderUsage() {
  const u = state.usage || {}
  const s = u.totals || state.dashboard?.summary || {}
  return `
  <section class="section">
    <div class="section-title">L4 · 官方 Claude stats（oauth/usage + unified headers）</div>
    ${summaryCards({ ...s, vm_count: state.dashboard?.summary?.vm_count, account_count: state.dashboard?.summary?.account_count, peak_5h: s.peak_5h, peak_7d: s.peak_7d, near_limit: s.near_limit, requests: s.requests, tokens_in: s.tokens_in, tokens_out: s.tokens_out })}
    <div class="card ">
      <table class="table">
        <thead >
          <tr>
            <th >账号 / VM</th>
            <th >5h</th>
            <th >7d</th>
            <th >并发</th>
            <th >请求</th>
            <th >状态</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-border">
          ${(u.accounts||[]).map(a => {
            const p5=pct(a.utilization_5h), p7=pct(a.utilization_7d)
            return `<tr class="hover:bg-muted/20">
              <td ><div>${esc(a.email||a.account_id)}</div><div class="text-xs muted">${esc(a.vm_id||'')}</div></td>
              <td class="p-3 w-36"><div class="text-xs mb-1">${p5.toFixed(1)}%</div><div class="bar"><i style="width:${Math.min(100,p5)}%;background:${barColor(p5)}"></i></div></td>
              <td class="p-3 w-36"><div class="text-xs mb-1">${p7.toFixed(1)}%</div><div class="bar"><i style="width:${Math.min(100,p7)}%;background:${barColor(p7)}"></i></div></td>
              <td >${a.inflight}/${a.max_concurrency}</td>
              <td >${a.requests||0}</td>
              <td >${a.near_limit?'<span class="badge border-red-800 text-red-400">near limit</span>':'<span class="badge">ok</span>'}</td>
            </tr>`
          }).join('') || '<tr><td class="p-3 muted" colspan="6">暂无数据，请先探测</td></tr>'}
        </tbody>
      </table>
    </div>
    <p class="text-xs muted">安全策略：utilization ≥ ${(Number(u.safety_ratio||0.95)*100).toFixed(0)}% 时拒绝新请求，避免打满 5h / 周限额。</p>
  </section>`
}

function renderProtocol() {
  const models = state.models?.items || []
  return `
  <section class="section">
    <div class="section-title">L5 · 协议网关</div>
    <div class="card text-sm stack-sm">
      <div class="font-medium">入站 → 对齐 → VM Claude Code 转发</div>
      <ul class="muted text-xs stack-sm ">
        <li>OpenAI Chat Completions <code class="">/v1/chat/completions</code></li>
        <li>OpenAI Responses <code class="">/v1/responses</code></li>
        <li>Anthropic Messages <code class="">/v1/messages</code></li>
        <li>原则：对齐 Claude Code 官方请求标准（非伪装）</li>
        <li>仅官方 Claude 模型名；system 外站归因可剥离</li>
      </ul>
    </div>
    <div class="card">
      <div class="section-title">官方模型（${models.length}）· source=${esc(state.models?.source||'')}${state.models?.note ? ' · '+esc(state.models.note) : ''}</div>
      ${state.models?.error || state.models?.note && !models.length ? `<p class="text-xs danger">${esc(state.models.error||state.models.note)}</p>` : ''}
      <div class="grid-2">
        ${models.map(m => `<div class="card"><div class="font-medium">${esc(m.label||m.id)}</div><div class="text-xs muted font-mono">${esc(m.id)}</div></div>`).join('') || '<div class="text-sm muted">暂无模型数据</div>'}
      </div>
    </div>
  </section>`
}

function renderSettings() {
  const r = state.routing || {}
  return `
  <section class="section">
    <div class="section-title">L6 · 配置</div>
    <div class="grid-3">
      <div class="card">
        <div class="font-medium text-sm mb-2">粘性路由</div>
        <pre class="text-xs overflow-auto max-h-64 bg-background rounded-md p-3 border border">${esc(JSON.stringify(r.sticky||{}, null, 2))}</pre>
      </div>
      <div class="card">
        <div class="font-medium text-sm mb-2">额度 / 并发</div>
        <pre class="text-xs overflow-auto max-h-64 bg-background rounded-md p-3 border border">${esc(JSON.stringify({ quota: r.quota, concurrency: r.concurrency }, null, 2))}</pre>
      </div>
    </div>
    <div class="card">
      <div class="font-medium text-sm mb-2">活跃粘性会话</div>
      <pre class="text-xs overflow-auto max-h-48 bg-background rounded-md p-3 border border">${esc(JSON.stringify(r.sessions||{}, null, 2))}</pre>
    </div>
    <p class="text-xs muted">修改请调用 <code>PUT /api/panel/routing</code>；契约见 PANEL_API.md</p>
  </section>`
}


async function importProxies() {
  const text = document.getElementById('proxyImport')?.value || ''
  if (!text.trim()) { toast('请粘贴 SOCKS5 列表'); return }
  try {
    const r = await api('/api/panel/proxies/import', { method: 'POST', body: JSON.stringify({ text }) })
    const d = r.data || r
    toast(`导入 +${d.added} 跳过 ${d.skipped}`)
    await refresh()
  } catch (e) { toast(e.message) }
}
async function probeProxies() {
  try {
    toast('探测代理池…')
    await api('/api/panel/proxies/probe', { method: 'POST' })
    toast('探测完成')
    await refresh()
  } catch (e) { toast(e.message) }
}
async function probeProxyOne(id) {
  try {
    await api('/api/panel/proxies/' + id + '/probe', { method: 'POST' })
    await refresh()
  } catch (e) { toast(e.message) }
}
async function enableProxy(id, on) {
  try {
    await api('/api/panel/proxies/' + id + '/' + (on ? 'enable' : 'disable'), { method: 'POST' })
    await refresh()
  } catch (e) { toast(e.message) }
}
async function unbindProxy(id) {
  try {
    await api('/api/panel/proxies/' + id + '/unbind', { method: 'POST' })
    await refresh()
  } catch (e) { toast(e.message) }
}
async function setProbeInterval(min) {
  try {
    await api('/api/panel/proxies/config', { method: 'PUT', body: JSON.stringify({ probe_interval_min: Number(min) }) })
    toast('探测间隔 ' + min + ' 分钟')
    await refresh()
  } catch (e) { toast(e.message) }
}
async function allocateProxy(vmId) {
  try {
    const r = await api('/api/panel/vms/' + vmId + '/allocate-proxy', { method: 'POST' })
    toast('已绑定 ' + (r.data?.id || ''))
    await refresh()
  } catch (e) { toast(e.message) }
}

function renderProxies() {
  const px = state.proxies || {}
  const cfg = px.config || {}
  const tot = px.totals || {}
  const list = px.proxies || []
  const interval = cfg.probe_interval_min || 10
  return `
  <section class="section">
    <div class="section-title">L1/L6 · SOCKS5 代理池 · 一代理绑定一虚拟机</div>
    <div class="grid-3">
      ${card('总数', tot.total??0, '池容量')}
      ${card('空闲', tot.free??0, '可自动分配')}
      ${card('已绑定', tot.bound??0, '1:1 VM')}
      ${card('健康', tot.ok??0, 'status=ok')}
      ${card('停用', tot.dead??0, 'fail→停用调度')}
    </div>

    <div class="card stack-md">
      <div class="font-medium text-sm">自动探测间隔</div>
      <div class="actions">
        ${[5,10,30,60].map(m => `
          <button class="btn ${interval===m?'btn-primary':'btn-outline'}" onclick="setProbeInterval(${m})">${m} 分钟</button>
        `).join('')}
        <button class="btn btn-outline" onclick="probeProxies()">立即全量探测</button>
      </div>
      <p class="text-xs muted">连续失败 ≥ ${cfg.max_failures||2} 次 → 停用该代理，并<strong>暂停绑定 VM 的调度</strong></p>
    </div>

    <div class="card stack-md">
      <div class="font-medium text-sm">批量导入</div>
      <textarea id="proxyImport" class="input h-28 py-2 font-mono text-xs" placeholder="每行一条：&#10;socks5://user:pass@host:port&#10;host:port&#10;host:port:user:pass"></textarea>
      <button class="btn btn-primary" onclick="importProxies()">导入到代理池</button>
    </div>

    <div class="card ">
      <table class="table">
        <thead >
          <tr>
            <th >代理</th>
            <th >状态</th>
            <th >延迟</th>
            <th >绑定 VM</th>
            <th >失败</th>
            <th class="p-3 text-right font-medium">操作</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-border">
          ${list.map(p => `
            <tr class="hover:bg-muted/20">
              <td >
                <div class="mono">${esc(p.host)}:${p.port}</div>
                <div class="text-[10px] muted">${esc(p.id)}${p.has_auth?' · auth':''}</div>
              </td>
              <td ><span class="badge ${p.status==='ok'?'ok':p.status==='dead'?'border-red-800 text-red-400':''}">${esc(p.status)}</span> ${p.enabled?'':'· off'}</td>
              <td >${p.latency_ms!=null?p.latency_ms+'ms':'—'}</td>
              <td class="p-3 font-mono text-xs">${esc(p.bound_vm_id||'—')}</td>
              <td >${p.consecutive_failures||0}${p.last_error?' <span class="text-xs muted">'+esc(p.last_error)+'</span>':''}</td>
              <td class="p-3 text-right space-x-1">
                <button class="btn btn-ghost h-8 text-xs" onclick="probeProxyOne('${p.id}')">探测</button>
                ${p.enabled
                  ? `<button class="btn btn-ghost h-8 text-xs" onclick="enableProxy('${p.id}', false)">停用</button>`
                  : `<button class="btn btn-ghost h-8 text-xs" onclick="enableProxy('${p.id}', true)">启用</button>`}
                ${p.bound_vm_id?`<button class="btn btn-ghost h-8 text-xs" onclick="unbindProxy('${p.id}')">解绑</button>`:''}
              </td>
            </tr>
          `).join('') || '<tr><td class="p-3 muted" colspan="6">池为空，请先导入</td></tr>'}
        </tbody>
      </table>
    </div>
    <p class="text-xs muted">虚拟机创建/分配：<code>POST /api/panel/vms/:id/allocate-proxy</code> 自动领取一台空闲 SOCKS5（优先 status=ok）。</p>
  </section>`
}


;(function initAuth(){
  const u = localStorage.getItem(LS_USER) || ''
  const tok = localStorage.getItem(LS) || ''
  const base = localStorage.getItem(LS_BASE) || ''
  const baseEl = document.getElementById('loginBaseInput')
  if (baseEl && base) baseEl.value = base
  if (tok) {
    document.getElementById('loginGate').classList.add('hidden')
    document.body.classList.remove('login-only')
    document.getElementById('loginUser').textContent = u || 'admin'
  } else {
    document.getElementById('loginGate').classList.remove('hidden')
    document.body.classList.add('login-only')
  }
})()
if (key()) refresh()
else document.getElementById('main').innerHTML = '<p class="text-sm muted">在左下角填入 API Key 后点击保存</p>'

// nav bind
document.getElementById('nav').addEventListener('click', (e) => {
  const item = e.target.closest('.nav-item')
  if (!item) return
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
  item.classList.add('active')
  state.view = item.dataset.view
  render()
})
initAuth()
if (localStorage.getItem(LS)) refresh()
  </script>
</body>
</html>
