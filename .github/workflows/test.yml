name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: npm ci
      - run: npm run test:node
      - run: npm run test:go
      - run: cd worker && go vet ./...
      - run: npm run build:worker
