/* ── concurrent load test ───────────────────────────────── */
const LS_LT = 'kin_lt_setup'
const LT_MODELS = [
  { id: 'claude-opus-5', label: 'Opus 5' },
  { id: 'claude-sonnet-5', label: 'Sonnet 5' },
  { id: 'claude-haiku-4-5', label: 'Haiku 4.5' },
  { id: 'claude-fable-5', label: 'Fable 5' },
]
const LT_STOCKS = [
  { ticker: 'TSLA', name: 'Tesla' },
  { ticker: 'AAPL', name: 'Apple' },
  { ticker: 'GOOGL', name: 'Google' },
  { ticker: 'AMZN', name: 'AWS' },
  { ticker: 'SNDK', name: 'Sandisk' },
]
const LT_TURNS = [
  { n: 1, label: '只写研报' },
  { n: 2, label: '研报 + 评级' },
  { n: 3, label: '研报 + 评级 + 情景' },
]
let ltSetupLoaded = false

function ltStocks() {
  if (Array.isArray(state.loadtestStockList) && state.loadtestStockList.length) return state.loadtestStockList
  const legacy = state.loadtestStocks || []
  if (legacy.length) {
    return legacy.map(t => LT_STOCKS.find(s => s.ticker === t) || { ticker: t, name: t })
  }
  return LT_STOCKS.map(s => ({ ...s }))
}
function ltSaveSetup() {
  try {
    localStorage.setItem(LS_LT, JSON.stringify({
      stocks: ltStocks(),
      models: state.loadtestModels,
      concurrency: state.loadtestConcurrency,
      turns: state.loadtestTurns,
      maxTokens: state.loadtestMaxTokens,
    }))
  } catch {}
}
function ltLoadSetup() {
  if (ltSetupLoaded) return
  ltSetupLoaded = true
  try {
    const raw = JSON.parse(localStorage.getItem(LS_LT) || 'null')
    if (!raw || typeof raw !== 'object') return
    if (Array.isArray(raw.stocks) && raw.stocks.length) {
      state.loadtestStockList = raw.stocks.map(s => ({
        ticker: String(s.ticker || s).toUpperCase(),
        name: String(s.name || s.ticker || s),
      })).filter(s => s.ticker)
    }
    if (Array.isArray(raw.models) && raw.models.length) state.loadtestModels = raw.models
    if (raw.concurrency) state.loadtestConcurrency = Math.max(1, Math.min(20, Number(raw.concurrency) || 10))
    if (raw.turns) state.loadtestTurns = Math.max(1, Math.min(3, Number(raw.turns) || 2))
    if (raw.maxTokens) state.loadtestMaxTokens = Math.min(128000, Math.max(1, Number(raw.maxTokens) || 32000))
  } catch {}
}
function ltToggleModel(id) {
  const cur = new Set(state.loadtestModels || [])
  if (cur.has(id)) cur.delete(id); else cur.add(id)
  state.loadtestModels = LT_MODELS.map(m => m.id).filter(x => cur.has(x))
  if (!state.loadtestModels.length) state.loadtestModels = [id]
  ltSaveSetup()
  render()
}
function ltRemoveStock(ticker) {
  const next = ltStocks().filter(s => s.ticker !== ticker)
  if (!next.length) return toast('至少保留一只标的', 'err')
  state.loadtestStockList = next
  state.loadtestStocks = next.map(s => s.ticker)
  ltSaveSetup()
  render()
}
function ltAddStock(ticker, name) {
  const code = String(ticker || '').trim().toUpperCase().replace(/[^A-Z0-9.]/g, '')
  if (!code || code.length > 10) return toast('代码 1–10 位字母数字', 'err')
  const list = ltStocks()
  if (list.some(s => s.ticker === code)) return toast(code + ' 已在列表中', 'err')
  const preset = LT_STOCKS.find(s => s.ticker === code)
  list.push({ ticker: code, name: String(name || preset?.name || code).trim() || code })
  state.loadtestStockList = list
  state.loadtestStocks = list.map(s => s.ticker)
  ltSaveSetup()
  render()
}
function ltAddStockFromForm() {
  ltAddStock(document.getElementById('ltTicker')?.value, document.getElementById('ltName')?.value)
}
function ltResetStocks() {
  state.loadtestStockList = LT_STOCKS.map(s => ({ ...s }))
  state.loadtestStocks = LT_STOCKS.map(s => s.ticker)
  ltSaveSetup()
  render()
}
function ltSetConcurrency(v) {
  state.loadtestConcurrency = Math.max(1, Math.min(20, Number(v) || 10))
  ltSaveSetup()
}
function ltSetTurns(v) {
  state.loadtestTurns = Math.max(1, Math.min(3, Number(v) || 2))
  ltSaveSetup()
  render()
}
function ltSetMaxTokens(v) {
  const n = Number(v)
  state.loadtestMaxTokens = (!Number.isFinite(n) || n <= 0) ? 32000 : Math.min(128000, Math.max(1, Math.floor(n)))
  ltSaveSetup()
}
function ltStatus(s) {
  const k = String(s || '')
  if (k === 'ok') return { cls: 'ok', text: '成功' }
  if (k === 'error') return { cls: 'bad', text: '失败' }
  if (k === 'running') return { cls: 'run', text: '进行中' }
  if (k === 'cancelling') return { cls: 'run', text: '取消中' }
  if (k === 'cancelled') return { cls: 'wait', text: '已取消' }
  return { cls: 'wait', text: '排队' }
}

function stopLoadtestPoll() {
  if (state.loadtestPoll) { clearInterval(state.loadtestPoll); state.loadtestPoll = null }
}

async function refreshLoadtest(id) {
  try {
    const path = id ? '/api/panel/concurrent-test/' + encodeURIComponent(id) : '/api/panel/concurrent-test'
    const r = await api(path)
    if (r) state.loadtest = r
    const running = r && (r.status === 'running' || r.status === 'cancelling')
    state.loadtestRunning = !!running
    if (!running) {
      stopLoadtestPoll()
      loadLoadtestReports(r && r.report_day)
    }
    render()
  } catch {}
}

function pollLoadtest() {
  stopLoadtestPoll()
  const id = state.loadtest && state.loadtest.id
  state.loadtestPoll = setInterval(() => refreshLoadtest(id), 1200)
}

async function startLoadtest() {
  if (state.loadtestRunning) return toast('已有压测在运行', 'err')

  render()
  try {
    const r = await api('/api/panel/concurrent-test', {
      method: 'POST',
      body: JSON.stringify({
        concurrency: Number(state.loadtestConcurrency) || 10,
        turns: Number(state.loadtestTurns) || 2,

async function openLoadtestTurn(sessionIndex, turnN) {

  if (!id) return

    const r = await api('/api/panel/concurrent-test/' + encodeURIComponent(id) + '?text=1')

function renderLoadtest() {
  ltLoadSetup()
  if (state.loadtest === undefined) {
    state.loadtest = null
    refreshLoadtest()
  }
  const run = state.loadtest
  const sum = run && run.summary
  const models = state.loadtestModels || LT_MODELS.map(m => m.id)
  const stocks = ltStocks()
  const turns = Number(state.loadtestTurns) || 2
  const conc = Number(state.loadtestConcurrency) || 10
  const running = !!(run && (run.status === 'running' || run.status === 'cancelling')) || state.loadtestRunning
  const unusedPresets = LT_STOCKS.filter(s => !stocks.some(x => x.ticker === s.ticker))
  const runSt = ltStatus(run && run.status)
  const rows = (run && run.sessions || []).map(s => {
    const st = ltStatus(s.status)
    const turnBtns = (s.turns || []).map(t => t.finished
      ? `<button class="lt-turn" onclick="openLoadtestTurn(${s.index},${t.n})">第${t.n}轮${t.ok ? '' : ' · 失败'}</button>`
      : '').filter(Boolean).join('')
    return `<tr>
      <td><b>${esc(s.ticker)}</b><div class="text-xs faint">${esc(s.name || '')}</div></td>
      <td class="text-xs">${esc(String(s.model || '').replace(/^claude-/, ''))}</td>
      <td><span class="lt-status ${st.cls}">${esc(st.text)}</span></td>
      <td>${turnBtns || `<span class="faint text-xs">${esc((s.turn || 0) + ' / ' + (s.turns_planned || turns))}</span>`}</td>
      <td class="num">${s.duration_ms ? s.duration_ms + 'ms' : '—'}</td>
    </tr>`
  }).join('')
  const stat = (label, val) => `<div class="lt-stat"><span class="text-xs faint">${label}</span><b>${val ?? '—'}</b></div>`
  return `
  <div class="lt-page">
    <section class="lt-card">
      <div class="lt-card-h">
        <div>
          <h2>开始一轮</h2>
          <p>${conc} 路并行 · 每路 ${turns} 轮 · ${models.length} 个模型 · ${stocks.length} 只标的</p>
        </div>
        <div class="actions">
          <button class="btn btn-primary" ${running ? 'disabled' : ''} onclick="startLoadtest()">${running ? '进行中…' : '开始'}</button>
          ${running ? '<button class="btn" onclick="cancelLoadtest()">取消</button>' : ''}
        </div>
      </div>
      <div class="lt-field">
        <div class="lt-lab">模型</div>
        <div class="preset">${LT_MODELS.map(m => `<button class="${models.includes(m.id) ? 'on' : ''}" onclick="ltToggleModel('${m.id}')">${esc(m.label)}</button>`).join('')}</div>
      </div>
      <div class="lt-field">
        <div class="lt-lab">标的<em>可增删，每路轮询一只</em></div>
        <div class="preset">${stocks.map(s => `<span class="lt-chip"><b>${esc(s.ticker)}</b>${s.name && s.name !== s.ticker ? `<i>${esc(s.name)}</i>` : ''}<button type="button" onclick="ltRemoveStock('${esc(s.ticker)}')" aria-label="移除 ${esc(s.ticker)}">×</button></span>`).join('')}</div>
        <div class="lt-add">
          <input class="input" id="ltTicker" placeholder="代码 NVDA" maxlength="10" onkeydown="if(event.key==='Enter'){event.preventDefault();ltAddStockFromForm()}"/>
          <input class="input wide" id="ltName" placeholder="名称（可选）" maxlength="32" onkeydown="if(event.key==='Enter'){event.preventDefault();ltAddStockFromForm()}"/>
          <button class="btn btn-sm" onclick="ltAddStockFromForm()">添加</button>
          <button class="btn btn-sm" onclick="ltResetStocks()">恢复默认</button>
        </div>
        ${unusedPresets.length ? `<div class="lt-quick">${unusedPresets.map(s => `<button type="button" onclick="ltAddStock('${s.ticker}','${esc(s.name)}')">+ ${esc(s.ticker)}</button>`).join('')}</div>` : ''}
      </div>
      <div class="lt-field">
        <div class="lt-params">
          <div>
            <div class="lt-lab">轮次</div>
            <div class="seg" role="group" aria-label="轮次">${LT_TURNS.map(t => `<button class="${turns===t.n?'on':''}" onclick="ltSetTurns(${t.n})">${t.n} · ${esc(t.label)}</button>`).join('')}</div>
          </div>
          <div class="lt-num">
            <div class="lt-lab">并发</div>
            <input class="input" type="number" min="1" max="20" value="${esc(conc)}" onchange="ltSetConcurrency(this.value)"/>
          </div>
          <div class="lt-num">
            <div class="lt-lab">思考预算</div>
            <input class="input" type="number" min="1" max="128000" step="1024" value="${esc(state.loadtestMaxTokens || 32000)}" onchange="ltSetMaxTokens(this.value)"/>
          </div>
        </div>
      </div>
    </section>
    ${run ? `
    <section class="lt-card">
      <div class="lt-card-h">
        <div>
          <h2>本次结果</h2>
          <p><span class="lt-status ${runSt.cls}">${esc(runSt.text)}</span> · ${esc(run.id || '')}</p>
        </div>
      </div>
      <div class="lt-grid">
        ${stat('成功', (sum && (sum.ok + '/' + sum.total)) || '—')}
        ${stat('失败', sum && sum.error)}
        ${stat('成功率', sum ? Math.round((sum.success_rate || 0) * 100) + '%' : '—')}
        ${stat('p50', sum && sum.duration_ms && sum.duration_ms.p50 != null ? sum.duration_ms.p50 + 'ms' : '—')}
        ${stat('tokens', sum && sum.tokens && sum.tokens.output)}
      </div>
      <table class="table">
        <thead><tr><th>标的</th><th>模型</th><th>状态</th><th>正文</th><th>耗时</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="faint">等待会话…</td></tr>'}</tbody>
      </table>
      ${run.report_markdown ? `<details class="lt-details"><summary>运行汇总</summary><pre class="lt-pre">${esc(run.report_markdown)}</pre></details>` : ''}
    </section>` : ''}
    ${renderLoadtestArchive()}
  </div>`
}

function renderLoadtestArchive() {
  const bag = state.loadtestReports
  const days = (bag && bag.days) || []
  const day = state.loadtestReportDay || (bag && bag.day) || ''
  const items = (bag && bag.items) || []
  return `
    <section class="lt-card">
      <div class="lt-card-h">
        <div>
          <h2>已保存正文</h2>
          <p>${day ? esc(day) + ' · ' + items.length + ' 篇' : '按日期查看落地的研报'}</p>
        </div>
        <div class="toolbar">
          ${days.length ? `<select class="input" onchange="loadLoadtestReports(this.value)">${days.map(d => `<option value="${esc(d)}" ${d===day?'selected':''}>${esc(d)}</option>`).join('')}</select>` : ''}
          <button class="btn btn-sm" onclick="loadLoadtestReports(state.loadtestReportDay || '')">刷新</button>
        </div>
      </div>
      ${items.length ? `<div class="lt-files">${items.map(f => `<button class="lt-file" onclick="openLoadtestReport('${esc(f.day)}','${esc(f.name)}')"><b>${esc(f.name)}</b><span>${esc(String(f.bytes || 0))} B</span></button>`).join('')}</div>` : emptyBox('这一天还没有正文')}
    </section>`
}

/* ── router ──────────────────────────────────────────────── */
function render() {
  const views = { overview: renderOverview, cluster: renderCluster, vm: renderVm, import: renderImport, usage: renderUsage, models: renderModels, loadtest: renderLoadtest, protocol: renderProtocol, keys: renderKeys, logs: renderLogs, proxies: renderProxies, settings: renderSettings }
  const fn = views[state.view] || renderOverview
  const main = document.getElementById('main')
  if (!key()) {
    main.innerHTML = '<p class="text-sm faint">请先登录</p>'
    return
  }
  try {
    if (state.loading && !state.dashboard) {
      main.innerHTML = skeleton(state.view === 'usage' || state.view === 'proxies' ? 'table' : 'cards')
      return
    }
    main.innerHTML = fn()
  } catch (e) {
    main.innerHTML = '<p class="text-sm danger">渲染错误: ' + esc(e.message) + '</p>'
  }
}

document.getElementById('nav')?.addEventListener('click', (e) => {
  const item = e.target.closest('.nav-item')
  if (!item) return
  go(item.dataset.view)
})
window.addEventListener('hashchange', () => applyRoute())

function parseHash() {
  const h = (location.hash || '#/overview').replace(/^#\/?/, '')
  const parts = h.split('/').filter(Boolean)
  const view = parts[0] || 'overview'
  const id = parts[1] || null
  return { view, id }
}
function go(view, id) {
  const path = id ? `#/${view}/${id}` : `#/${view}`
  if (location.hash === path) {
    applyRoute()
    return
  }
  location.hash = path
}
function applyRoute() {
  const { view, id } = parseHash()
  const known = titles[view] ? view : 'overview'
  state.view = known
  if (id) state.selectedVm = id
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === known))
  const pair = titles[known] || ['', '']
  const pt = document.getElementById('pageTitle')
  const pd = document.getElementById('pageDesc')
  if (pt) pt.textContent = pair[0]
  if (pd) pd.textContent = pair[1]
  if (known === 'vm' && id) {
    openVm(id)
    return
  }
  if (known === 'vm' && !id) {
    state.selectedVm = null
    state.detail = null
  }
  if (known === 'keys' && state.apiKeys == null) loadKeys()
  if (known === 'logs' && state.logs == null) loadLogs()
  if ((known === 'logs' || known === 'overview') && state.logStats == null) loadLogStats().then(() => { if (state.view === known) render() })
  if (known === 'models' && state.modelPolicy == null) loadModelPolicyView()
  if (known === 'loadtest' && state.loadtest === undefined) refreshLoadtest()
  if (known === 'loadtest' && state.loadtestReports == null) loadLoadtestReports()
  render()
  arSync()
}

function bootstrap() {
  if (bootstrapped) return
  bootstrapped = true
  const u = localStorage.getItem(LS_USER) || ''
  const tok = key()
  const base = localStorage.getItem(LS_BASE) || ''
  const baseEl = document.getElementById('loginBaseInput')
  if (baseEl && base) baseEl.value = base
  if (tok) {
    setSession(tok, u || 'admin')
    showApp(u || 'admin')
    refresh().then(() => { applyRoute(); arSync() })
  } else {
    showLogin()
    document.getElementById('main').innerHTML = '<p class="text-sm faint">请登录后继续</p>'
  }
}
bootstrap()
  </script>
</body>
